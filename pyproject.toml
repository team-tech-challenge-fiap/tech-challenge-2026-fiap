[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-ia"
version = "0.1.0"
description = "Pipeline de classificação de risco cardiovascular."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4",
    "xgboost>=2.0", "shap>=0.46", "matplotlib>=3.8", "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Extra de imagens de ECG (src/cardio_visual): pip install -e ".[cnn]". Para GPU, instale o PyTorch com CUDA antes.
cnn = ["torch>=2.2", "torchvision>=0.17", "pillow>=10"]

[project.scripts]
cardio-train = "cardio.models.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
